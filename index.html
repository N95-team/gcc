<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GCC Cricket Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Aura border around page */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 6px solid;
      border-image: linear-gradient(90deg, #0ff, #a0f, #00f, #ff00de) 1;
      border-radius: 20px;
      filter: blur(10px);
      animation: borderPulse 4s infinite alternate;
      pointer-events: none;
    }

    @keyframes borderPulse {
      from { transform: scale(1); opacity: 0.7; }
      to { transform: scale(0.98); opacity: 1; }
    }

    /* Neon aura rectangle header */
    .header-box {
      padding: 20px 40px;
      border: 4px solid;
      border-image: linear-gradient(90deg, #0ff, #a0f, #00f) 1;
      border-radius: 8px;
      background: rgba(0,0,0,0.4);
      animation: slideUp 2.5s ease forwards, glowBox 2s infinite alternate, shake 3s infinite;
      opacity: 0;
    }

    .header-box h1 {
      font-size: 70px;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(90deg, #0ff, #a0f, #00f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px #0ff, 0 0 80px #a0f, 0 0 120px #00f;
    }

    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes glowBox {
      from { box-shadow: 0 0 30px #0ff, 0 0 60px #a0f; }
      to { box-shadow: 0 0 60px #a0f, 0 0 120px #0ff; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      50% { transform: translateX(3px); }
      75% { transform: translateX(-2px); }
    }

    /* Button row */
    .buttons {
      display: flex;
      justify-content: center;
      margin-top: 80px;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Futuristic RGB buttons */
    .btn {
      margin: 20px;
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: rgba(0,0,0,0.3);
      border: 3px solid;
      border-image: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet) 1;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: 0.4s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: -12px;
      left: -12px;
      right: -12px;
      bottom: -12px;
      border-radius: 14px;
      background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
      filter: blur(25px);
      opacity: 0.6;
      z-index: -1;
      transition: 0.4s;
    }

    .btn:hover {
      color: black;
      background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
      box-shadow: 0 0 40px #0ff, 0 0 80px #a0f;
      transform: scale(1.05);
    }

    .note {
      font-size: 14px;
      color: #ccc;
      margin-top: 5px;
      text-align: center;
    }

    /* WTC loading screen */
    #wtc-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: white;
    }

    #wtc-screen h2 {
      font-size: 60px;
      background: linear-gradient(90deg, #0ff, #a0f, #00f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px #0ff, 0 0 80px #a0f;
      margin-bottom: 40px;
    }

    .loader {
      border: 8px solid #333;
      border-top: 8px solid #0ff;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header-box" id="header">
    <h1>WELCOME TO GCC PAGE</h1>
  </div>

  <div class="buttons" id="buttons">
    <div>
      <button class="btn" onclick="openWTC()">WTC</button>
      <div class="note"></div>
    </div>

    <div>
      <button class="btn">ASIA CUP</button>
      <div class="note">Not available at the moment...</div>
    </div>

    <div>
      <button class="btn">T10 WORLD CUP</button>
      <div class="note">Not available at the moment...</div>
    </div>

    <div>
      <button class="btn">CHAMPIONS TROPHY</button>
      <div class="note">Not available at the moment...</div>
    </div>
  </div>

  <!-- WTC loading screen -->
  <div id="wtc-screen">
    <h2>WTC</h2>
    <div class="loader"></div>
  </div>

  <script>
    function openWTC() {
      // Hide header and buttons
      document.getElementById("header").style.display = "none";
      document.getElementById("buttons").style.display = "none";

      // Show WTC screen
      document.getElementById("wtc-screen").style.display = "flex";

      // Redirect after 3 seconds
      setTimeout(function() {
        window.location.href = "wtc.html";
      }, 3000);
    }
  </script>
</body>
</html>
