<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GCC Cricket Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Aura border */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 6px solid;
      border-image: linear-gradient(90deg, #0ff, #a0f, #00f, #ff00de) 1;
      border-radius: 20px;
      filter: blur(10px);
      animation: borderPulse 4s infinite alternate;
      pointer-events: none;
    }

    @keyframes borderPulse {
      from { transform: scale(1); opacity: 0.7; }
      to { transform: scale(0.98); opacity: 1; }
    }

    .header-box h1 {
      font-size: 70px;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(90deg, #0ff, #a0f, #00f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px #0ff, 0 0 80px #a0f, 0 0 120px #00f;
    }

    .buttons {
      display: flex;
      justify-content: center;
      margin-top: 80px;
    }

    .btn {
      margin: 20px;
      padding: 15px 40px;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: rgba(0,0,0,0.3);
      border: 3px solid;
      border-image: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet) 1;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: 0.4s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn:hover {
      color: black;
      background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
      box-shadow: 0 0 40px #0ff, 0 0 80px #a0f;
      transform: scale(1.05);
    }

    /* Sign-up box */
    #signup-box {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      border: 4px solid;
      border-image: linear-gradient(90deg, #0ff, #a0f, #00f) 1;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      color: #0ff;
      text-shadow: 0 0 15px #a0f;
      width: 400px;
      z-index: 1000;
    }

    #signup-box h2 {
      margin: 0 0 20px;
    }

    #signup-box .close {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 24px;
      color: #ff4444;
      cursor: pointer;
    }

    #signup-box button {
      margin-top: 20px;
      padding: 10px 25px;
      font-size: 18px;
      border: 2px solid;
      border-image: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet) 1;
      border-radius: 8px;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    #signup-box button:hover {
      background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
      color: black;
    }
  </style>
</head>
<body>
  <div class="header-box" id="header">
    <h1>WELCOME TO GCC PAGE</h1>
  </div>

  <div class="buttons" id="buttons">
    <div>
      <button class="btn" onclick="openWTC()">WTC</button>
    </div>
    <div>
      <button class="btn">ASIA CUP</button>
      <div class="note">Not available at the moment...</div>
    </div>
    <div>
      <button class="btn">T10 WORLD CUP</button>
      <div class="note">Not available at the moment...</div>
    </div>
    <div>
      <button class="btn">CHAMPIONS TROPHY</button>
      <div class="note">Not available at the moment...</div>
    </div>
  </div>

  <!-- Sign-up box -->
  <div id="signup-box">
    <span class="close" onclick="redirectIndex()">×</span>
    <h2>Hey you there,<br>you haven’t signed up yet!</h2>
    <button onclick="redirectAccount()">Continue</button>
  </div>

  <script>
    let firstClick = true;

    function openWTC() {
      if (firstClick) {
        document.getElementById("signup-box").style.display = "block";
      } else {
        window.location.href = "wtc.html";
      }
    }

    function redirectAccount() {
      firstClick = false;
      window.location.href = "account.html";
    }

    function redirectIndex() {
      firstClick = false;
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
