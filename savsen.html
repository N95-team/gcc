<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>South Africa vs England - WTC Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .summary-box {
      margin: 30px auto;
      width: 90%;
      border: 3px solid;
      border-image: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet) 1;
      border-radius: 12px;
      background: rgba(0,0,0,0.6);
      padding: 20px;
      color: #0ff;
      text-shadow: 0 0 15px #a0f;
      font-size: 18px;
    }
    .summary-box h2 {
      text-align: center;
      font-size: 22px;
      background: linear-gradient(90deg, #0ff, #a0f, #00f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .fixture-btn {
      display: block;
      margin: 12px auto;
      padding: 12px 20px;
      font-size: 18px;
      font-family: 'Orbitron', sans-serif;
      color: #0ff;
      background: rgba(0,0,0,0.6);
      border: 2px solid;
      border-image: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet) 1;
      border-radius: 10px;
      text-align: center;
      text-shadow: 0 0 15px #a0f;
      cursor: pointer;
      width: 60%;
      transition: 0.3s;
    }
    .fixture-btn:hover {
      background: rgba(0,255,255,0.1);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="header">🏏 South Africa vs England - WTC Stats</div>

  <!-- Match Summary -->
  <div class="summary-box">
    <h2>Match Summary</h2>
    <p><strong>Toss:</strong> Pending</p>
    <p><strong>1st Innings (SA):</strong> Pending</p>
    <p><strong>2nd Innings (ENG):</strong> Pending</p>
    <p><strong>3rd Innings (SA):</strong> Pending</p>
    <p><strong>4th Innings (ENG):</strong> Pending</p>
    <p><strong>Result:</strong> Pending</p>
  </div>

  <!-- Inning Buttons -->
  <a href="savseni1.html"><div class="fixture-btn">1st Innings</div></a>
  <a href="savseni2.html"><div class="fixture-btn">2nd Innings</div></a>
  <a href="savseni3.html"><div class="fixture-btn">3rd Innings</div></a>
  <a href="savseni4.html"><div class="fixture-btn">4th Innings</div></a>

  <div class="buttons">
    <a href="stats.html"><button class="btn">Back to Stats Hub</button></a>
  </div>
</body>
</html>
